services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drocsid
      POSTGRES_PASSWORD: drocsid
      POSTGRES_DB: drocsid
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drocsid -d drocsid"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
